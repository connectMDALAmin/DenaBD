    <script>
      /* Ensure window.fetch has both getter and setter so browser extensions that intercept fetch requests can assign to it safely */
      (function() {
        try {
          var originalFetch = window.fetch;
          if (typeof originalFetch === 'function') {
            var customFetch = function() {
              return originalFetch.apply(window, arguments);
            };
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return customFetch;
              },
              set: function(val) {
                customFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (_) {
          // ignore if already configured
        }

        /* Suppress external Chrome/browser extension script errors from bubbling to app window */
        window.addEventListener('error', function(event) {
          if (
            (event.filename && (
              event.filename.indexOf('chrome-extension://') !== -1 ||
              event.filename.indexOf('moz-extension://') !== -1 ||
              event.filename.indexOf('safari-extension://') !== -1
            )) ||
            (event.message && (
              event.message.indexOf('chrome-extension://') !== -1 ||
              event.message.indexOf('Cannot set property fetch') !== -1
            ))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
